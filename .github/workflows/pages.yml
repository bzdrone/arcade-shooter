name: Deploy converter to GitHub Pages

# Deliberately manual: pushing a change does not publish the site.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check site packaging
        run: node --test tests/site-build.test.mjs
      - name: Build static site
        run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: local/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
